<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROJECT BACKROOMS</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { VRButton } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x242019);
scene.fog = new THREE.Fog(0x242019, 5, 22);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 100
);
camera.position.set(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const light = new THREE.PointLight(0xffe5a0, 2, 18);
light.position.set(0, 2.8, 0);
scene.add(light);

// Backrooms floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.MeshStandardMaterial({ color: 0x82764e })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Walls
const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0xd4c477
});

const walls = [];

function makeWall(x, y, z, w, h, d) {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    wallMaterial
  );
  wall.position.set(x, y, z);
  scene.add(wall);
  walls.push(wall);
}

makeWall(0, 1.5, -6, 12, 3, 0.3);
makeWall(0, 1.5, 6, 12, 3, 0.3);
makeWall(-6, 1.5, 0, 0.3, 3, 12);
makeWall(6, 1.5, 0, 0.3, 3, 12);

// Internal maze walls
makeWall(2, 1.5, -2, 0.3, 3, 5);
makeWall(-2, 1.5, 2, 5, 3, 0.3);

// VR hands
const hands = [];
const previous = [];
const handGeometry = new THREE.SphereGeometry(0.09, 16, 16);
const handMaterial = new THREE.MeshStandardMaterial({
  color: 0xffcc99
});

for (let i = 0; i < 2; i++) {
  const hand = renderer.xr.getControllerGrip(i);
  const visual = new THREE.Mesh(handGeometry, handMaterial);
  hand.add(visual);
  rig.add(hand);

  hands.push(hand);
  previous.push(new THREE.Vector3());
}

// Movement physics
const velocity = new THREE.Vector3();
const handSphere = new THREE.Sphere(
  new THREE.Vector3(), 0.14
);
const wallBoxes = [];

for (const wall of walls) {
  wallBoxes.push(new THREE.Box3().setFromObject(wall));
}

let initialized = false;

function isTouching(hand) {
  hand.getWorldPosition(handSphere.center);

  // Floor contact
  if (handSphere.center.y < 0.16 &&
      Math.abs(handSphere.center.x) < 5.8 &&
      Math.abs(handSphere.center.z) < 5.8) {
    return true;
  }

  // Wall contact
  return wallBoxes.some(box =>
    box.intersectsSphere(handSphere)
  );
}

renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(
    renderer.xr.isPresenting ? 1 / 72 : 1 / 60,
    0.04
  );

  if (!initialized) {
    hands.forEach((hand, i) => {
      hand.getWorldPosition(previous[i]);
    });
    initialized = true;
  }

  // Gorilla-style pushing
  hands.forEach((hand, i) => {
    const current = new THREE.Vector3();
    hand.getWorldPosition(current);

    if (isTouching(hand)) {
      const push = previous[i].clone().sub(current);
      velocity.addScaledVector(push, 7.5);
    }

    hand.getWorldPosition(previous[i]);
  });

  // Gravity and momentum
  velocity.y -= 9.8 * dt;
  velocity.multiplyScalar(0.985);

  rig.position.addScaledVector(velocity, dt);

  // Keep player above floor
  if (rig.position.y < 0) {
    rig.position.y = 0;
    velocity.y = Math.max(0, velocity.y);
  }

  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
