
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROJECT BACKROOMS</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { VRButton } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x242019);
scene.fog = new THREE.Fog(0x242019, 5, 24);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

// IMPORTANT: local-floor already provides floor-relative tracking.
camera.position.set(0, 0, 0);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');

document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

// PLAYER RIG
const rig = new THREE.Group();
rig.position.set(0, 0, 0);
rig.add(camera);
scene.add(rig);

// LIGHTING
scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const light = new THREE.PointLight(
  0xffe5a0,
  2,
  20
);

light.position.set(0, 2.8, 0);
scene.add(light);

// FLOOR
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.MeshStandardMaterial({
    color: 0x82764e
  })
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// WALLS
const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0xd4c477
});

const walls = [];

function makeWall(x, y, z, w, h, d) {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    wallMaterial
  );

  wall.position.set(x, y, z);

  scene.add(wall);
  walls.push(wall);
}

// ROOM BOUNDARIES
makeWall(0, 1.5, -6, 12, 3, 0.3);
makeWall(0, 1.5, 6, 12, 3, 0.3);
makeWall(-6, 1.5, 0, 0.3, 3, 12);
makeWall(6, 1.5, 0, 0.3, 3, 12);

// MAZE
makeWall(2, 1.5, -2, 0.3, 3, 5);
makeWall(-2, 1.5, 2, 5, 3, 0.3);

// COLLISION BOXES
scene.updateMatrixWorld(true);

const wallBoxes = walls.map(wall =>
  new THREE.Box3().setFromObject(wall)
);

// VR HANDS
const hands = [];
const previousHands = [];
const handReady = [false, false];

const handGeometry = new THREE.SphereGeometry(
  0.09, 16, 16
);

const handMaterial = new THREE.MeshStandardMaterial({
  color: 0xffcc99
});

for (let i = 0; i < 2; i++) {

  const hand = renderer.xr.getControllerGrip(i);

  const visual = new THREE.Mesh(
    handGeometry,
    handMaterial
  );

  hand.add(visual);
  rig.add(hand);

  hands.push(hand);
  previousHands.push(new THREE.Vector3());
}

// PHYSICS
const velocity = new THREE.Vector3();

const handSphere = new THREE.Sphere(
  new THREE.Vector3(),
  0.14
);

const gravity = 9.8;

function isTouching(hand) {

  hand.getWorldPosition(handSphere.center);

  // FLOOR CONTACT
  if (
    handSphere.center.y < 0.18 &&
    Math.abs(handSphere.center.x) < 5.8 &&
    Math.abs(handSphere.center.z) < 5.8
  ) {
    return true;
  }

  // WALL CONTACT
  for (const box of wallBoxes) {
    if (box.intersectsSphere(handSphere)) {
      return true;
    }
  }

  return false;
}

// ANIMATION
renderer.setAnimationLoop((time, frame) => {

  const dt = Math.min(
    renderer.xr.isPresenting ? 1 / 72 : 1 / 60,
    0.04
  );

  // GORILLA TAG STYLE HAND MOVEMENT
  for (let i = 0; i < 2; i++) {

    const hand = hands[i];

    const current = hand.position.clone();

    if (!handReady[i]) {
      previousHands[i].copy(current);
      handReady[i] = true;
      continue;
    }

    if (isTouching(hand)) {

      // Move the player opposite to the hand movement.
      const push = previousHands[i].clone()
        .sub(current);

      rig.position.add(push);

    }

    previousHands[i].copy(current);
  }

  // GRAVITY
  velocity.y -= gravity * dt;
  rig.position.y += velocity.y * dt;

  // FLOOR COLLISION
  if (rig.position.y <= 0) {

    rig.position.y = 0;

    if (velocity.y < 0) {
      velocity.y = 0;
    }
  }

  // ROOM BOUNDARIES
  rig.position.x = THREE.MathUtils.clamp(
    rig.position.x, -5.35, 5.35
  );

  rig.position.z = THREE.MathUtils.clamp(
    rig.position.z, -5.35, 5.35
  );

  renderer.render(scene, camera);
});

// RESIZE
window.addEventListener('resize', () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>
</body>
</html>
