<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECT BACKROOMS</title>
<style>
body { margin:0; overflow:hidden; background:#111; font-family:Arial,sans-serif; }
canvas { display:block; }
#status {
  position:fixed; top:10px; left:10px;
  color:white; background:#000a; padding:8px;
  z-index:2; font-size:14px;
}
</style>
</head>
<body>
<div id="status">PROJECT: BACKROOMS — Ready</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { VRButton } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x242019);
scene.fog = new THREE.Fog(0x242019, 5, 24);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth/window.innerHeight, 0.1, 100
);
camera.position.set(0,0,0);

// RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

// PLAYER RIG
const rig = new THREE.Group();
scene.add(rig);
rig.add(camera);

// LIGHTS
scene.add(new THREE.AmbientLight(0xffffff,0.8));
const light = new THREE.PointLight(0xffe5a0,2,20);
light.position.set(0,2.8,0);
scene.add(light);

// FLOOR
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(12,12),
  new THREE.MeshStandardMaterial({color:0x82764e})
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// WALLS
const walls = [];
const wallMaterial = new THREE.MeshStandardMaterial({color:0xd4c477});

function makeWall(x,y,z,w,h,d) {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),wallMaterial
  );
  wall.position.set(x,y,z);
  scene.add(wall);
  walls.push(wall);
}

makeWall(0,1.5,-6,12,3,0.3);
makeWall(0,1.5,6,12,3,0.3);
makeWall(-6,1.5,0,0.3,3,12);
makeWall(6,1.5,0,0.3,3,12);
makeWall(2,1.5,-2,0.3,3,5);
makeWall(-2,1.5,2,5,3,0.3);

scene.updateMatrixWorld(true);
const wallBoxes = walls.map(w => new THREE.Box3().setFromObject(w));

// CONTROLLERS
const hands = [];
const previousHands = [];
const handReady = [false,false];

const handGeometry = new THREE.SphereGeometry(0.11,16,16);
const handMaterial = new THREE.MeshStandardMaterial({color:0xffcc99});

for(let i=0;i<2;i++) {
  // Controller object tracks the actual controller pose.
  const hand = renderer.xr.getController(i);
  const visual = new THREE.Mesh(handGeometry,handMaterial);
  hand.add(visual);
  rig.add(hand);
  hands.push(hand);
  previousHands.push(new THREE.Vector3());
}

// PHYSICS
const velocity = new THREE.Vector3();
const gravity = 9.8;
const handWorld = new THREE.Vector3();
const handSphere = new THREE.Sphere(new THREE.Vector3(),0.14);
const pushVector = new THREE.Vector3();
const playerRadius = 0.28;
let grounded = true;

function handTouchesWorld(hand) {
  hand.getWorldPosition(handWorld);
  handSphere.center.copy(handWorld);

  // Floor contact
  if(handWorld.y < 0.25 &&
     Math.abs(handWorld.x) < 5.8 &&
     Math.abs(handWorld.z) < 5.8) return true;

  // Wall contact
  for(const box of wallBoxes) {
    if(box.intersectsSphere(handSphere)) return true;
  }
  return false;
}

// Keep player inside room and above floor
function resolvePlayer() {
  const min = -5.55 + playerRadius;
  const max = 5.55 - playerRadius;

  rig.position.x = THREE.MathUtils.clamp(rig.position.x,min,max);
  rig.position.z = THREE.MathUtils.clamp(rig.position.z,min,max);

  // Prevent player center from passing through the floor.
  if(rig.position.y < 0) {
    rig.position.y = 0;
    if(velocity.y < 0) velocity.y = 0;
    grounded = true;
  } else {
    grounded = rig.position.y <= 0.001;
  }
}

// ANIMATION
renderer.setAnimationLoop((time,frame) => {
  const dt = Math.min(
    renderer.xr.isPresenting ? 1/72 : 1/60,
    0.04
  );

  let tracked = 0;

  for(let i=0;i<2;i++) {
    const hand = hands[i];

    // Controller position in world space.
    hand.getWorldPosition(handWorld);
    const current = handWorld.clone();

    tracked++;

    if(!handReady[i]) {
      previousHands[i].copy(current);
      handReady[i] = true;
      continue;
    }

    if(handTouchesWorld(hand)) {
      // Move opposite to the controller's movement.
      pushVector.copy(previousHands[i]).sub(current);

      // Only apply horizontal arm-push movement.
      pushVector.y = 0;

      if(pushVector.length() > 0.01) {
        rig.position.add(pushVector);
      }
    }

    previousHands[i].copy(current);
  }

  // Gravity
  if(!grounded) {
    velocity.y -= gravity*dt;
    rig.position.y += velocity.y*dt;
  } else {
    velocity.y = 0;
  }

  resolvePlayer();

  document.getElementById('status').textContent =
    renderer.xr.isPresenting
      ? 'VR ACTIVE — Controllers: '+tracked+
        (grounded ? ' — GROUNDED' : ' — FALLING')
      : 'PROJECT: BACKROOMS — Enter VR to play';

  renderer.render(scene,camera);
});

// RESIZE
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
